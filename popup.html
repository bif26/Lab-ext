<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>LanguageShadow</title>
  <style>
    body { width: 260px; padding: 12px; font-family: sans-serif; background: #241e18; color: #faf7f2; }
    h2 { margin: 0 0 8px; font-size: 16px; }
    h2 span { color: #f97316; }
    .btn { display: block; width: 100%; padding: 8px; margin: 6px 0; border: none; border-radius: 8px; background: #f97316; color: white; font-weight: bold; cursor: pointer; }
    .btn-secondary { background: #2c251e; border: 1px solid #fb923c33; }
  </style>
</head>
<body>
  <h2>Language<span>Shadow</span></h2>
  <button id="openPanel" class="btn">Open Practice Panel</button>
  <button id="changeLang" class="btn btn-secondary">Change Language</button>
  <button id="feedback" class="btn btn-secondary">Feedback</button>
  <script src="popup.js"></script>
</body>
</html>
